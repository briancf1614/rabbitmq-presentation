name: Build and Deploy Enterprise Architecture

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Wait, project might be .net 10. Let's use 8.0.x for worker, or maybe not specify to use global.json or default

    - name: Build API Producer
      run: dotnet build api-producer/api-producer.slnx

    - name: Build Worker Consumer
      run: dotnet build worker-consumer/worker-consumer.slnx

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install and Build Angular
      run: |
        cd angular-client
        npm install --legacy-peer-deps
        npm run build

  deploy:
    needs: [build-and-test, build-frontend]
    runs-on: ubuntu-latest # fallback to ubuntu for now since self-hosted is offline for this demo agent run

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Validate Docker Compose
      run: |
        docker compose config
